<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamaaggama Hojjetichaa - HRKMSO</title>
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Gamaaggama Hojjetichaa</h1>
            <div class="border-b pb-4 mb-4">
                <p class="text-lg text-gray-700"><strong>Maqaa:</strong> {{ employee.full_name }}</p>
                <p class="text-sm text-gray-500" id="employeeBirthDate" data-birth="{{ employee.birth_date }}"><strong>Guyyaa Dhalootaa:</strong> {{ employee.birth_date }}</p>
                <p class="text-sm font-semibold text-blue-600 mt-1" id="autoAgeDisplay">Umrii Shallagame: Shallagaa jira...</p>
            </div>

            <form method="POST" action="">
                <!-- Score Inputs -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Raawwii Hojii (Performance):</label>
                        <input type="number" step="0.01" name="performance_score" id="perf" class="score-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Barnoota & Leenjii (Education):</label>
                        <input type="number" step="0.01" name="education_score" id="edu" class="score-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Naamusaa (Discipline):</label>
                        <input type="number" step="0.01" name="discipline_score" id="disc" class="score-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Seera Kabajuu (Law Compliance):</label>
                        <input type="number" step="0.01" name="law_compliance_score" id="law" class="score-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Muxannoo Hojii (Experience):</label>
                        <input type="number" step="0.01" name="experience_score" id="exp" class="score-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Tajaajila Hawwii (Service Spirit):</label>
                        <input type="number" step="0.01" name="service_spirit_score" id="serv" class="score-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="0.00">
                    </div>
                </div>

                <!-- Hidden or Automatic Age Score -->
                <input type="hidden" name="age_score" id="age" value="0">

                <div class="mb-4 bg-gray-50 p-4 rounded border">
                    <h2 class="text-lg font-bold text-gray-800">Ida'ama Waliigalaa: <span id="totalScoreDisplay" class="text-green-600">0.00 / 100%</span></h2>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Sadarkaa Itti aanu (Next Rank):</label>
                    <select name="next_rank_id" class="shadow border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        {% for rank in ranks %}
                            <option value="{{ rank.id }}">{{ rank.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="flex items-center justify-between">
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Gamaaggama Galmeessi</button>
                    <a href="{{ url_for('employees') }}" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">Gara Hojjettootaatti Deebi'i</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Safe JavaScript for Age and Total Calculation -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            try {
                let bDateEl = document.getElementById('employeeBirthDate');
                let bStr = bDateEl ? bDateEl.getAttribute('data-birth') : '';
                let calculatedAgeScore = 0;
                let ageText = "Hin beekamu";

                if (bStr && bStr.trim() !== "" && bStr !== "None" && bStr !== "null") {
                    let parts = bStr.split(/[-/]/);
                    if (parts.length > 0) {
                        let birthYear = parseInt(parts[0].length === 4 ? parts[0] : parts[parts.length - 1]);
                        if (!isNaN(birthYear)) {
                            if (birthYear < 100) birthYear += (birthYear > 30 ? 1900 : 2000);
                            let currentYear = new Date().getFullYear();
                            let age = currentYear - birthYear;
                            ageText = age + " Waggaa";
                            
                            if (age >= 20 && age <= 40) {
                                calculatedAgeScore = 4.0;
                            } else if (age > 40 && age <= 50) {
                                calculatedAgeScore = 3.0;
                            } else if (age > 50) {
                                calculatedAgeScore = 2.0;
                            } else {
                                calculatedAgeScore = 1.0;
                            }
                        }
                    }
                }

                let ageDisplay = document.getElementById('autoAgeDisplay');
                if (ageDisplay) {
                    ageDisplay.innerText = "Umrii Shallagame: " + ageText;
                }
                
                let ageInput = document.getElementById('age');
                if (ageInput) {
                    ageInput.value = calculatedAgeScore;
                }

                function calculateTotal() {
                    let perf = parseFloat(document.getElementById('perf')?.value) || 0;
                    let edu = parseFloat(document.getElementById('edu')?.value) || 0;
                    let disc = parseFloat(document.getElementById('disc')?.value) || 0;
                    let law = parseFloat(document.getElementById('law')?.value) || 0;
                    let exp = parseFloat(document.getElementById('exp')?.value) || 0;
                    let age = parseFloat(document.getElementById('age')?.value) || 0;
                    let serv = parseFloat(document.getElementById('serv')?.value) || 0;

                    let total = 0;
                    let hasInput = (
                        (document.getElementById('perf')?.value ?? '') !== '' || 
                        (document.getElementById('edu')?.value ?? '') !== '' || 
                        (document.getElementById('disc')?.value ?? '') !== '' || 
                        (document.getElementById('law')?.value ?? '') !== '' || 
                        (document.getElementById('exp')?.value ?? '') !== '' || 
                        (document.getElementById('serv')?.value ?? '') !== ''
                    );

                    if (hasInput) {
                        total = perf + edu + disc + law + exp + age + serv;
                    } else {
                        total = 0.00;
                    }

                    let totalDisplay = document.getElementById('totalScoreDisplay');
                    if (totalDisplay) {
                        totalDisplay.innerText = total.toFixed(2) + " / 100%";
                    }
                }

                document.querySelectorAll('.score-input').forEach(input => {
                    input.addEventListener('input', calculateTotal);
                });
                
                calculateTotal();
            } catch (err) {
                console.log("JS Error: ", err);
            }
        });
    </script>
</body>
</html>
