<!-- JavaScript for Automatic Age Calculation & Total Score -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        let bDateEl = document.getElementById('employeeBirthDate');
        let bStr = bDateEl ? bDateEl.getAttribute('data-birth') : '';
        let calculatedAgeScore = 0;
        let ageText = "Hin beekamu";

        if (bStr && bStr.trim() !== "" && bStr !== "None") {
            try {
                let parts = bStr.split(/[-/]/);
                let birthYear = parseInt(parts[0].length === 4 ? parts[0] : parts[parts.length - 1]);
                if (!isNaN(birthYear)) {
                    if (birthYear < 100) birthYear += (birthYear > 30 ? 1900 : 2000);
                    let currentYear = new Date().getFullYear();
                    let age = currentYear - birthYear;
                    ageText = age + " Waggaa";
                    
                    if (age >= 20 && age <= 40) {
                        calculatedAgeScore = 4.0;
                    } else if (age > 40 && age <= 50) {
                        calculatedAgeScore = 3.0;
                    } else if (age > 50) {
                        calculatedAgeScore = 2.0;
                    } else {
                        calculatedAgeScore = 1.0;
                    }
                }
            } catch(e) {
                console.log("Error calculating age:", e);
            }
        }

        document.getElementById('autoAgeDisplay').innerText = "Umrii Shallagame: " + ageText;
        document.getElementById('age').value = calculatedAgeScore;

        function calculateTotal() {
            let perf = parseFloat(document.getElementById('perf').value) || 0;
            let edu = parseFloat(document.getElementById('edu').value) || 0;
            let disc = parseFloat(document.getElementById('disc').value) || 0;
            let law = parseFloat(document.getElementById('law').value) || 0;
            let exp = parseFloat(document.getElementById('exp').value) || 0;
            let age = parseFloat(document.getElementById('age').value) || 0;
            let serv = parseFloat(document.getElementById('serv').value) || 0;

            // Yoo input-ileen biroo hundi duwwaa ta'an 0.00 ta'ee akka eegalu godhameera
            let total = 0;
            let hasInput = (document.getElementById('perf').value !== '' || 
                            document.getElementById('edu').value !== '' || 
                            document.getElementById('disc').value !== '' || 
                            document.getElementById('law').value !== '' || 
                            document.getElementById('exp').value !== '' || 
                            document.getElementById('serv').value !== '');

            if (hasInput) {
                total = perf + edu + disc + law + exp + age + serv;
            } else {
                total = 0.00;
            }

            document.getElementById('totalScoreDisplay').innerText = total.toFixed(2) + " / 100%";
        }

        document.querySelectorAll('.score-input').forEach(input => {
            input.addEventListener('input', calculateTotal);
        });
        
        calculateTotal();
    });
</script>
