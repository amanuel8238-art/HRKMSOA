<form id="employee-form">
    <div class="form-group">
        <label>Maqaa Guutuu <span style="color:red">*</span></label>
        <input type="text" id="emp-name" required placeholder="Maqaa guutuu galchaa">
    </div>

    <div class="form-row" style="display: flex; gap: 16px;">
        <div class="form-group" style="flex: 1;">
            <label>Saala <span style="color:red">*</span></label>
            <select id="emp-gender" required>
                <option value="">-- Saala Filadhu --</option>
                <option value="Dhiira">Dhiira</option>
                <option value="Dhalaa">Dhalaa</option>
            </select>
        </div>

        <div class="form-group" style="flex: 1;">
            <label>Raankii / Sadarkaa <span style="color:red">*</span></label>
            <select id="emp-rank" required>
                <!-- JavaScript tiin guutama -->
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Damee / Aanaa (Aanaa Dadar dabalatee) <span style="color:red">*</span></label>
        <select id="emp-branch" required>
            <!-- JavaScript tiin guutama -->
        </select>
    </div>

    <div class="form-group">
        <label>Gahee Hojii (Position) <span style="color:red">*</span></label>
        <input type="text" id="emp-position" required placeholder="Gahee hojii galchaa">
    </div>

    <button type="submit" class="btn-primary full-width" style="width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Miseensa Galmeessi</button>
</form>
