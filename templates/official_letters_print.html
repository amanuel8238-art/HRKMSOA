<!-- Modal / Form Xalayaa Qopheessuu -->
<div class="modal fade" id="officialLetterModal2" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-envelope-open-text me-2"></i>Unka Xalayaa Ramaddii Qopheessuu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="{{ url_for('generate_letter') }}" method="POST" target="_blank">
                <input type="hidden" name="letter_type" value="official_letter_2">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Maqaa & Gulantaa Hojjetaa (fkn: Saj.Ol Talilaa Gutamaa tiif):</label>
                            <input type="text" name="emp_rank_name" class="form-control" placeholder="fkn: Saj.Ol Talilaa Gutamaa tiif" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Mindaa Gonfoo (Salary):</label>
                            <input type="number" step="0.01" name="salary" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Durgoo Nyaataa (Food Allowance):</label>
                            <input type="number" step="0.01" name="food_allowance" class="form-control" placeholder="0.00">
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Maqaa Baajataa (Budget Name):</label>
                            <input type="text" name="budget_name" class="form-control" placeholder="fkn: G/Saj. Qanansisaa Huseen" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Qaama Gaafate / Manaajimentii:</label>
                            <input type="text" name="requesting_body" class="form-control" placeholder="fkn: Koreen Manaajimentii Komishinii">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">Guyyaa Walga'ii Manaajimentii:</label>
                            <input type="text" name="meeting_date" class="form-control" placeholder="DD/MM/YYYY" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Guyyaa Hojii Eegaluu (Effective Date):</label>
                            <input type="text" name="effective_date" class="form-control" placeholder="DD/MM/YYYY" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Maqaa Mana Sirreessaa (Ma/Sir/_____):</label>
                            <input type="text" name="branch_name" class="form-control" placeholder="fkn: Mag/Shanoo" required>
                        </div>

                        <!-- BIRaAn SIRREEFFAME: value="Rawwataa hojii Eegumsaan" haqameera -->
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Gahee Hojii (Job Position):</label>
                            <input type="text" name="job_position" class="form-control" placeholder="Fkn: Rawwataa hojii Eegumsaan / Itti Gaafatamaa Galmee" required>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Waaj/Ma/ Mana Sirreessaa (Branch Short):</label>
                            <input type="text" name="branch_short" class="form-control" placeholder="fkn: Mag/Shanoo">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Maqaa Mallatteessaa (Signer Name):</label>
                            <input type="text" name="signer_name" class="form-control" placeholder="Maqaa Mallaatteessaa">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Aangoo/Rank Mallatteessaa (Signer Rank):</label>
                            <input type="text" name="signer_rank" class="form-control" placeholder="fkn: Komaandara">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Garaagaltoo (G/G) - Sarara sararaan (Line by line) galchi:</label>
                            <textarea name="gg_list" class="form-control" rows="5" placeholder="Da/Bezii Hog/Qab/Namaa tiif KMSO
Ma/Si/ Go/Mag/Shanoo tiif
Wa/Mall/ Mag/Shanoo tiif
Shanoo"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cufi</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-print me-1"></i> Xalayaa Qopheessi & Print</button>
                </div>
            </form>
        </div>
    </div>
</div>
