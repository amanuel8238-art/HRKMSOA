{% extends "base.html" %}

{% block title %}Hojjetaa Fooyyessuu (Edit Employee) - HRKMSO{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-header bg-warning text-dark py-3">
                    <h4 class="mb-0 fw-bold"><i class="fas fa-user-edit me-2"></i> Odeeffannoo Hojjetaa Fooyyessuu</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="row g-3">
                            <!-- Maqaa Guutuu -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Maqaa Guutuu</label>
                                <input type="text" name="full_name" class="form-control" value="{{ employee.full_name }}" required>
                            </div>

                            <!-- ID Addaa (Unique ID) -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">ID Addaa (Unique ID)</label>
                                <input type="text" name="unique_id" class="form-control" value="{{ employee.unique_id }}" required>
                            </div>

                            <!-- Saala -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Saala</label>
                                <select name="gender" class="form-select" required>
                                    <option value="Dhiira" {% if employee.gender in ['Dhiira', 'Dhiirra'] %}selected{% endif %}>Dhiira</option>
                                    <option value="Dhalaa" {% if employee.gender in ['Dhalaa', 'Dubartii'] %}selected{% endif %}>Dhalaa</option>
                                </select>
                            </div>

                            <!-- Damee (Branch) -->
                            {% if current_user.role == 'admin' %}
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Damee (Branch)</label>
                                <select name="branch_id" class="form-select" required>
                                    {% for b in branches %}
                                    <option value="{{ b.id }}" {% if employee.branch_id == b.id %}selected{% endif %}>{{ b.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            {% endif %}

                            <!-- Gulantaa (Rank) -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Gulantaa (Rank)</label>
                                <select name="rank_id" class="form-select" required>
                                    {% for r in ranks %}
                                    <option value="{{ r.id }}" {% if employee.rank_id == r.id %}selected{% endif %}>{{ r.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Gita Hojii -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Gita Hojii</label>
                                <input type="text" name="job_position" class="form-control" value="{{ employee.job_position }}">
                            </div>

                            <!-- Sadarkaa Barumsaa -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Sadarkaa Barumsaa</label>
                                <input type="text" name="education_level" class="form-control" value="{{ employee.education_level }}">
                            </div>

                            <!-- Gosa Barumsaa (Field of Study) -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Gosa Barumsaa (Field of Study)</label>
                                <input type="text" name="field_of_study" class="form-control" value="{{ employee.field_of_study }}">
                            </div>

                            <!-- Mindaa Gulantaa -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Mindaa Gulantaa</label>
                                <input type="number" step="0.01" name="rank_salary" class="form-control" value="{{ employee.rank_salary }}">
                            </div>

                            <!-- Durgoo Bakkaa (Location Allowance) -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Durgoo Bakkaa (Location Allowance)</label>
                                <input type="number" step="0.01" name="location_allowance" class="form-control" value="{{ employee.location_allowance }}">
                            </div>

                            <!-- Durgoo Nyaataa (Food Allowance) -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Durgoo Nyaataa (Food Allowance)</label>
                                <input type="number" step="0.01" name="food_allowance" class="form-control" value="{{ employee.food_allowance }}">
                            </div>

                            <!-- Guyyaa Qacaramuu (Hire Date) -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Guyyaa Qacaramuu (Hire Date)</label>
                                <input type="date" name="hire_date" class="form-control" value="{{ employee.hire_date }}">
                            </div>

                            <!-- Guyyaa Dhalootaa (Birth Date) -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Guyyaa Dhalootaa (Birth Date)</label>
                                <input type="date" name="birth_date" class="form-control" value="{{ employee.birth_date }}">
                            </div>

                            <!-- Guyyaa Gulantaa (Rank Date) -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Guyyaa Gulantaa (Rank Date)</label>
                                <input type="date" name="rank_date" class="form-control" value="{{ employee.rank_date }}">
                            </div>

                            <!-- Status -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Status</label>
                                <select name="status" class="form-select">
                                    <option value="Active" {% if employee.status == 'Active' %}selected{% endif %}>Active</option>
                                    <option value="Resigned" {% if employee.status == 'Resigned' %}selected{% endif %}>Resigned</option>
                                    <option value="Terminated" {% if employee.status == 'Terminated' %}selected{% endif %}>Terminated</option>
                                    <option value="Du'aan" {% if employee.status == "Du'aan" %}selected{% endif %}>Du'aan</option>
                                    <option value="Fedhiitiin" {% if employee.status == 'Fedhiitiin' %}selected{% endif %}>Fedhiitiin</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4 d-flex justify-content-between align-items-center">
                            <div>
                                <!-- Gara Dashboordii Deebi'uuf -->
                                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary me-2">
                                    <i class="fas fa-home me-1"></i> Gara Dashboordii
                                </a>
                                <!-- Gara Hojjettootaatti Deebi'uuf -->
                                <a href="{{ url_for('employees') }}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-1"></i> Hojjettootaatti Deebi'i
                                </a>
                            </div>
                            <button type="submit" class="btn btn-warning fw-bold px-4">Fooyyessi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
