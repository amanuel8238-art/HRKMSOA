<!-- MODAL FOR GENERATING OFFICIAL LETTERS -->
    <div id="letterModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modalTitle" class="text-base font-bold text-indigo-950">Unka Xalayaa Qopheessuu</h3>
                <button onclick="closeLetterModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
            </div>
            
            <form action="{{ url_for('generate_letter') }}" method="POST" target="_blank" class="space-y-3 text-xs">
                <input type="hidden" id="letter_type" name="letter_type" value="">

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Maqaa & Gulantaa Hojjetaa (fkn: Saj.Ol Talilaa Gutamaa tiif):</label>
                    <input type="text" name="emp_rank_name" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500" placeholder="Saj.Ol Talilaa Gutamaa tiif">
                </div>

                <!-- Fields for Jijjiirraa & Ramaddii -->
                <div id="commonSalaryFields" class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Mindaa Gonfoo (Salary):</label>
                        <input type="number" step="0.01" name="salary" value="19538" class="w-full border rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Durgoo Nyaataa (Food Allowance):</label>
                        <input type="number" step="0.01" name="food_allowance" value="1200" class="w-full border rounded-lg p-2">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Maqaa Baajataa (Budget Name):</label>
                    <input type="text" name="budget_name" value="G/Saj. Qanansisaa Huseen" class="w-full border rounded-lg p-2">
                </div>

                <!-- Dynamic Sections based on Letter Type -->
                <div id="jijjiirraaFields" class="space-y-3 hidden border-t pt-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Damee Duraanii (From Branch):</label>
                            <input type="text" name="from_branch" value="Ma/Sir/Go/Bo/Bahaa" class="w-full border rounded-lg p-2">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Damee Haaraa (To Branch):</label>
                            <input type="text" name="to_branch" value="Ma/Sir/Go/Gu/Lixaatti" class="w-full border rounded-lg p-2">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Gabaabduu Damee Duraanii:</label>
                            <input type="text" name="from_branch_short" value="Bo/Bahaa" class="w-full border rounded-lg p-2">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Gabaabduu Damee Haaraa:</label>
                            <input type="text" name="to_branch_short" value="Gu/Lixaa" class="w-full border rounded-lg p-2">
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Sababa Jijjiirraa:</label>
                        <input type="text" name="reason" value="hanqinaa Namusaaf jecha Onkolooleessaa 1/2019 irraa eeggalee" class="w-full border rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Gita Hojii (Job Position):</label>
                        <input type="text" name="job_position" value="Rawwataa hojii Eegumsaan" class="w-full border rounded-lg p-2">
                    </div>
                </div>

                <!-- Ramaddii Fields -->
                <div id="ramaddiiFields" class="space-y-3 hidden border-t pt-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Qaama Gaafate / Manaajimentii:</label>
                            <input type="text" name="requesting_body" value="Koreen Manaajimentii Komishinii" class="w-full border rounded-lg p-2">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Guyyaa Walga'ii Manaajimentii:</label>
                            <input type="text" name="meeting_date" value="10/01/2019" class="w-full border rounded-lg p-2">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Guyyaa Hojii Eegaluu (Effective Date):</label>
                            <input type="text" name="effective_date" value="01/02/2019" class="w-full border rounded-lg p-2">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Maqaa Mana Sirreessaa (Ma/Sir/_____):</label>
                            <input type="text" name="branch_name" value="Mag/Shanoo" class="w-full border rounded-lg p-2">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Gahee Hojii (Job Position):</label>
                            <input type="text" name="job_position" value="Raawwataa Hojii Eegumsaa" class="w-full border rounded-lg p-2">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Waajjira Mallaqaa (wa/Mallaqaa _____):</label>
                            <input type="text" name="finance_office" value="Waaj/Mallaqaa Shanoo" class="w-full border rounded-lg p-2">
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Waaj/Ma/ Mana Sirreessaa (Branch Short):</label>
                        <input type="text" name="branch_short" value="Mag/Shanoo" class="w-full border rounded-lg p-2">
                    </div>
                </div>

                <!-- Yaala Fields -->
                <div id="yaalaFields" class="space-y-3 hidden border-t pt-3">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Waajira Buufata Fayyaa / Hospitaala:</label>
                        <input type="text" name="to_hospital_office" value="Hospitaala Waliigalaa Asallaatiif" class="w-full border rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Bakki / Magaalaa:</label>
                        <input type="text" name="location_city" value="Asallaa" class="w-full border rounded-lg p-2">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Lakk. Rifaarii (Ref Referral):</label>
                            <input type="text" name="ref_referral" value="REF-987/2019" class="w-full border rounded-lg p-2">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Guyyaa Rifaarii:</label>
                            <input type="text" name="referral_date" value="10/01/2019" class="w-full border rounded-lg p-2">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Guyyaa Beelama:</label>
                            <input type="text" name="appointment_date" value="20/02/2019" class="w-full border rounded-lg p-2">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Guyyaa Deebii:</label>
                            <input type="text" name="return_date" value="22/02/2019" class="w-full border rounded-lg p-2">
                        </div>
                    </div>
                </div>

                <!-- Garaagaltoo (G/G) Add-ons -->
                <div class="border-t pt-2">
                    <label class="block font-semibold text-slate-700 mb-1">Garaagaltoo (G/G) - Sarara sararaan (Line by line) galchi:</label>
                    <textarea name="gg_list" rows="4" class="w-full border rounded-lg p-2" placeholder="Da/Bezii Hog/Qab/Namaa tiif KMSO&#10;Ma/Si/ Go/Mag/Shanoo tiif&#10;Wa/Mall/ Mag/Shanoo tiif Shanoo">Da/Bezii Hog/Qab/Namaa tiif KMSO
Ma/Si/ Go/Mag/Shanoo tiif
Wa/Mall/ Mag/Shanoo tiif Shanoo
Ma/Si/ Go/Ki/Li/Shawaa tiif
Wa/Mall/ Go/ Ki/Li/Shawaa tiif Walisoo</textarea>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onclick="closeLetterModal()" class="bg-slate-300 hover:bg-slate-400 text-slate-800 px-4 py-2 rounded-lg font-semibold">Duubatti</button>
                    <button type="submit" class="bg-indigo-900 hover:bg-indigo-950 text-white px-5 py-2 rounded-lg font-semibold"><i class="fas fa-print mr-1"></i> Xalayaa Qopheessi / Print</button>
                </div>
            </form>
        </div>
    </div>
